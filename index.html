<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大型廢棄傢俱預約清運申請系統 | 潔淨家園線上服務 portal (Google Drive 拍照結案版)</title>
  <meta name="description" content="家戶免費大型廢棄傢俱線上預約清運申請系統，結合 Google Sheets 與 Google Drive 雲端資料庫，包含照片上傳、清運標籤列印與清潔隊拍照結案功能。" />
  
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- QRCode JS CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: 'Noto Sans TC', sans-serif;
    }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Print media styling for furniture booking identification tag */
    @media print {
      html, body {
        overflow: visible !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
      }
      body * {
        visibility: hidden;
      }
      #root, .fixed, .overflow-y-auto {
        position: static !important;
        overflow: visible !important;
        max-height: none !important;
        height: auto !important;
        transform: none !important;
      }
      #printable-tag, #printable-tag * {
        visibility: visible !important;
      }
      #printable-tag {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 24px !important;
        background: #ffffff !important;
        color: #000000 !important;
        box-shadow: none !important;
        border: 4px dashed #000000 !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen selection:bg-emerald-500 selection:text-slate-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function getMinguoTime(d) {
      if (!d) d = new Date();
      var year = d.getFullYear() - 1911;
      var month = ('0' + (d.getMonth() + 1)).slice(-2);
      var day = ('0' + d.getDate()).slice(-2);
      var hours = ('0' + d.getHours()).slice(-2);
      var minutes = ('0' + d.getMinutes()).slice(-2);
      var seconds = ('0' + d.getSeconds()).slice(-2);
      return '民國' + year + '年' + month + '月' + day + '日 ' + hours + ':' + minutes + ':' + seconds;
    }
    
    function getMinguoCompactStr(d) {
      if (!d) d = new Date();
      var year = d.getFullYear() - 1911;
      var month = ('0' + (d.getMonth() + 1)).slice(-2);
      var day = ('0' + d.getDate()).slice(-2);
      return year + month + day;
    }

    // Data Constants
    const CATEGORIES = [
      { id: 'mattress', name: '床墊', icon: '🛏️', desc: '單人床墊、雙人床墊、彈簧床' },
      { id: 'cabinet', name: '櫃子', icon: '🗄️', desc: '衣櫃、鞋櫃、斗櫃、酒櫃、電視櫃' },
      { id: 'table', name: '桌子', icon: '🪑', desc: '餐桌、書桌、茶幾、電腦桌' },
      { id: 'chair', name: '椅子', icon: '🛋️', desc: '單人椅、辦公椅、雙人沙發、三人沙發' },
      { id: 'tv', name: '電視', icon: '📺', desc: '液晶電視、傳統電視（家電類）' },
      { id: 'fridge', name: '冰箱', icon: '🧊', desc: '單門冰箱、雙門/多門冰箱（家電類）' },
      { id: 'other', name: '其他', icon: '📦', desc: '大型收納架、金屬架、彈簧床框等' },
    ];

    const COUNTIES = [
      '基隆市', '台北市', '新北市', '桃園市', '新竹市', '新竹縣', '苗栗縣', 
      '台中市', '彰化縣', '南投縣', '雲林縣', '嘉義市', '嘉義縣', '台南市', 
      '高雄市', '屏東縣', '宜蘭縣', '花蓮縣', '台東縣', '澎湖縣', '金門縣', '連江縣'
    ];

    const CITY_DISTRICTS = [
      '信義區', '大安區', '中山區', '內湖區', '士林區', '北投區', 
      '松山區', '萬華區', '文山區', '南港區', '中正區', '大同區',
      '板橋區', '新莊區', '中和區', '三重區', '新店區', '土城區', '三義鄉', '苑裡鎮', '通霄鎮'
    ];

    const TERMS_LIST = [
      {
        id: 1,
        title: '服務對象限制',
        content: '本免費清運服務僅限一般家戶廢棄大型傢俱，事業單位（公司、工廠、飯店、店家等）或裝修廢棄物恕不受理。'
      },
      {
        id: 2,
        title: '搬運與放置地點規定',
        content: '申請人須於約定清運時間當日（或前一日晚上）將物品自行搬運至一樓約定地點放置，且不得妨礙道路交通安全。'
      },
      {
        id: 3,
        title: '清運單號標示規定',
        content: '請於搬出物品上貼妥「已預約清運單號或聯絡人姓名電話」字樣，以免被視為違規棄置。'
      },
      {
        id: 4,
        title: '嚴禁夾雜危險物品',
        content: '嚴禁夾雜危險物品（如高壓氣瓶、易燃物）、一般生活垃圾或一般事業廢棄物。'
      },
      {
        id: 5,
        title: '個人資料保護聲明',
        content: '本所個人資料蒐集目的僅作為廢棄物清運聯繫與核對使用，依個人資料保護法予以保護。'
      }
    ];

    const INITIAL_BOOKINGS = [];

    // Helper QR Code Component
    function QRCodeBox({ value, size = 96 }) {
      const qrRef = useRef(null);

      useEffect(() => {
        if (qrRef.current) {
          qrRef.current.innerHTML = '';
          if (window.QRCode) {
            new window.QRCode(qrRef.current, {
              text: value,
              width: size,
              height: size,
              colorDark: '#0f172a',
              colorLight: '#ffffff',
              correctLevel: window.QRCode.CorrectLevel.H
            });
          }
        }
      }, [value, size]);

      return <div ref={qrRef} className="inline-block p-1 bg-white rounded border border-slate-300" />;
    }

    // Main App Component
    function App() {
      const [activeTab, setActiveTab] = useState('booking'); // 'booking', 'query', 'admin'
      
      // GAS Web App URL state pre-configured with user's endpoint
      const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbw2fzd48VzT4IJgeFORnlid9VPOoHggihOBpqTc32ZdfwaAESUZrk_gRiMxnieQsxPq3g/exec';
      const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('gas_web_app_url') || DEFAULT_GAS_URL);
      const [showGasModal, setShowGasModal] = useState(false);
      const [isSyncingGas, setIsSyncingGas] = useState(false);
      const [syncMessage, setSyncMessage] = useState('');

      const [bookings, setBookings] = useState(() => {
        const saved = localStorage.getItem('bulky_furniture_bookings');
        return saved ? JSON.parse(saved) : INITIAL_BOOKINGS;
      });

      // Sync to localStorage as local cache
      useEffect(() => {
        localStorage.setItem('bulky_furniture_bookings', JSON.stringify(bookings));
      }, [bookings]);

      // Fetch from Google Sheets if GAS URL is configured
      const fetchFromGoogleSheets = async () => {
        if (!gasUrl) return;
        setIsSyncingGas(true);
        try {
          const res = await fetch(gasUrl);
          const json = await res.json();
          if (json.status === 'success' && json.data && Array.isArray(json.data) && json.data.length > 0) {
            setBookings(json.data);
            setSyncMessage(`已成功從 Google 試算表同步 ${json.data.length} 筆資料`);
          }
        } catch (e) {
          console.error('GAS Fetch Error:', e);
        } finally {
          setIsSyncingGas(false);
        }
      };

      useEffect(() => {
        let intervalId;
        if (gasUrl) {
          fetchFromGoogleSheets();
          // 每 60 秒自動從 Google Sheets 拉取最新資料 (Auto Pull)
          intervalId = setInterval(() => {
            fetchFromGoogleSheets();
          }, 60000);
        }
        return () => {
          if (intervalId) clearInterval(intervalId);
        };
      }, [gasUrl]);

      const handleSaveGasUrl = (url) => {
        const trimmed = url.trim();
        setGasUrl(trimmed);
        localStorage.setItem('gas_web_app_url', trimmed);
        setShowGasModal(false);
        if (trimmed) {
          fetchFromGoogleSheets();
        }
      };

      // Modal States
      const [successBooking, setSuccessBooking] = useState(null);
      const [printableBooking, setPrintableBooking] = useState(null);
      const [completionModalBooking, setCompletionModalBooking] = useState(null); // Sanitation Photo Completion Modal

      // Admin Auth State
      const [isAdminAuth, setIsAdminAuth] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [isCheckingPassword, setIsCheckingPassword] = useState(false);
      const [loginError, setLoginError] = useState('');

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        if (!gasUrl) {
          if (adminPasswordInput === 'admin') {
            setIsAdminAuth(true);
            setAdminPasswordInput('');
          } else {
            setLoginError('密碼錯誤 (Local Mode: 預設為 admin)');
          }
          return;
        }

        setIsCheckingPassword(true);
        try {
          const checkUrl = gasUrl + '?action=verifyPassword&password=' + encodeURIComponent(adminPasswordInput);
          const res = await fetch(checkUrl);
          const json = await res.json();
          if (json.status === 'success' && json.valid) {
            setIsAdminAuth(true);
            setAdminPasswordInput('');
          } else {
            setLoginError('密碼錯誤，請重新輸入。');
          }
        } catch (e) {
          console.error('Login Error:', e);
          setLoginError('連線驗證失敗，請檢查網路或 GAS 設定。');
        } finally {
          setIsCheckingPassword(false);
        }
      };

      // Reset auth when leaving admin tab
      useEffect(() => {
        if (activeTab !== 'admin') setIsAdminAuth(false);
      }, [activeTab]);

      // Form State
      const [applicantName, setApplicantName] = useState('');
      const [phone, setPhone] = useState('');
      const [email, setEmail] = useState('');
      const [county, setCounty] = useState('苗栗縣');
      const [district, setDistrict] = useState('三義鄉');
      const [detailAddress, setDetailAddress] = useState('');
      const [selectedItems, setSelectedItems] = useState([
        { categoryId: 'mattress', categoryName: '床墊', name: '雙人彈簧床墊', quantity: 1, note: '' }
      ]);
      const [photos, setPhotos] = useState([]);
      const defaultDate = new Date(Date.now() + 3 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      const [preferredDate, setPreferredDate] = useState(defaultDate);
      const [preferredTimeSlot, setPreferredTimeSlot] = useState('上午 (08:00 - 12:00)');
      const [locationNote, setLocationNote] = useState('');
      const [agreedTerms, setAgreedTerms] = useState([]);
      const [errors, setErrors] = useState({});

      // Completion Photo Upload State for Sanitation Worker
      const [completionPhotoBase64, setCompletionPhotoBase64] = useState('');
      const [completionPhotoName, setCompletionPhotoName] = useState('');
      const [completionNote, setCompletionNote] = useState('隊員已現場載運完畢，路面恢復清潔並拍攝照片結案。');
      const [isUploadingDrive, setIsUploadingDrive] = useState(false);

      // Query Search state
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [hasSearched, setHasSearched] = useState(false);



      // Item quantity control
      const handleItemQtyChange = (catId, delta) => {
        setSelectedItems((prev) => {
          const found = prev.find((i) => i.categoryId === catId);
          if (found) {
            const nextQty = found.quantity + delta;
            if (nextQty <= 0) return prev.filter((i) => i.categoryId !== catId);
            return prev.map((i) => (i.categoryId === catId ? { ...i, quantity: nextQty } : i));
          } else if (delta > 0) {
            const catObj = CATEGORIES.find((c) => c.id === catId);
            return [...prev, { categoryId: catId, categoryName: catObj.name, name: catObj.name, quantity: 1, note: '' }];
          }
          return prev;
        });
      };

      const getItemQty = (catId) => {
        const found = selectedItems.find((i) => i.categoryId === catId);
        return found ? found.quantity : 0;
      };

      // Photo Drag & Drop
      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        files.forEach((file) => {
          if (!file.type.startsWith('image/')) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            setPhotos((prev) => [
              ...prev,
              { id: Date.now() + Math.random(), name: file.name, url: ev.target.result }
            ]);
          };
          reader.readAsDataURL(file);
        });
      };



      // Terms Agreement Toggle
      const isAllTermsAgreed = TERMS_LIST.every((t) => agreedTerms.includes(t.id));
      const handleToggleTerm = (id) => {
        if (agreedTerms.includes(id)) {
          setAgreedTerms(agreedTerms.filter((i) => i !== id));
        } else {
          setAgreedTerms([...agreedTerms, id]);
        }
      };

      // Form Validation & Submission
      const handleFormSubmit = async (e) => {
        e.preventDefault();
        const errs = {};
        if (!applicantName.trim()) errs.applicantName = '請輸入申請人姓名';
        if (!phone.trim()) errs.phone = '請輸入聯絡電話';
        else if (!/^09\d{2}-?\d{3}-?\d{3}$/.test(phone.trim()) && !/^\d{8,10}$/.test(phone.trim())) {
          errs.phone = '請輸入正確格式電話 (如: 0912-345-678)';
        }
        if (!detailAddress.trim()) errs.detailAddress = '請填寫詳細清運地址';
        if (selectedItems.length === 0) errs.items = '請至少選擇一項待清運傢俱項目';
        if (agreedTerms.length < TERMS_LIST.length) errs.terms = '需全數同意 5 項申請聲明與規定';

        setErrors(errs);
        if (Object.keys(errs).length > 0) {
          window.scrollTo({ top: 120, behavior: 'smooth' });
          return;
        }

        const newBooking = {
          id: `FUR-${getMinguoCompactStr()}-${Math.floor(1000 + Math.random() * 9000)}`,
          applicantName,
          phone,
          email,
          county,
          district,
          address: detailAddress,
          preferredDate,
          preferredTimeSlot,
          locationNote,
          items: selectedItems,
          photos: photos.map((p) => p.url),
          status: '已收件',
          statusTimeline: [{ status: '已收件', time: getMinguoTime() }],
          createdAt: getMinguoTime(),
          agreedToTerms: true
        };

        // Guaranteed Sync to Google Sheets via GET parameter request
        if (gasUrl) {
          try {
            const syncUrl = gasUrl + '?action=createBooking&data=' + encodeURIComponent(JSON.stringify(newBooking));
            fetch(syncUrl, { mode: 'no-cors' }).catch(err => console.log(err));
          } catch (e) {
            console.error('GAS Sync Error:', e);
          }
        }

        setBookings((prev) => [newBooking, ...prev]);
        setSuccessBooking(newBooking);
      };

      // Search Query Logic
      const handleSearchSubmit = (e) => {
        e.preventDefault();
        const q = searchQuery.trim().toLowerCase();
        if (!q) return;
        const res = bookings.filter(
          (b) =>
            b.id.toLowerCase().includes(q) ||
            b.phone.replaceAll('-', '').includes(q.replaceAll('-', '')) ||
            b.applicantName.includes(q)
        );
        setSearchResults(res);
        setHasSearched(true);
      };

      // Admin Status Update (Bulletproof GAS Sync)
      const handleAdminUpdateStatus = (id, newStatus, note = '') => {
        const nowTime = getMinguoTime();
        setBookings((prev) =>
          prev.map((b) => {
            if (b.id === id) {
              return {
                ...b,
                status: newStatus,
                statusTimeline: [...(b.statusTimeline || []), { status: newStatus, time: nowTime, note }]
              };
            }
            return b;
          })
        );

        if (gasUrl) {
          try {
            const syncUrl = gasUrl + '?action=updateStatus&id=' + encodeURIComponent(id) + '&newStatus=' + encodeURIComponent(newStatus) + '&note=' + encodeURIComponent(note);
            fetch(syncUrl, { mode: 'no-cors' }).catch(err => console.log(err));
          } catch (e) {
            console.error('GAS Update Error:', e);
          }
        }
      };

      // Sanitation Photo Upload Completion Handler (Google Drive Upload)
      const handleCompletionPhotoFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setCompletionPhotoName(file.name);
        const reader = new FileReader();
        reader.onload = (ev) => {
          setCompletionPhotoBase64(ev.target.result);
        };
        reader.readAsDataURL(file);
      };



      const handleSubmitCompletionModal = async () => {
        if (!completionModalBooking) return;
        setIsUploadingDrive(true);

        const bookingId = completionModalBooking.id;
        const nowTime = getMinguoTime();

        // Update local state first
        setBookings((prev) =>
          prev.map((b) => {
            if (b.id === bookingId) {
              const timelineItem = {
                status: '清運完成',
                time: nowTime,
                note: completionNote,
                drivePhotoUrl: completionPhotoBase64
              };
              return {
                ...b,
                status: '清運完成',
                statusTimeline: [...(b.statusTimeline || []), timelineItem]
              };
            }
            return b;
          })
        );

        // Upload photo to Google Drive Folder (ID: 1TYi7otNJXyEuCdZqx6cqJwNnlZXqH7dV) via GAS POST
        if (gasUrl && completionPhotoBase64) {
          try {
            await fetch(gasUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'completeWithPhoto',
                id: bookingId,
                fileBase64: completionPhotoBase64,
                fileName: completionPhotoName || `completion_${bookingId}.jpg`,
                note: completionNote
              })
            });
          } catch (e) {
            console.error('Drive Upload Error:', e);
          }
        }

        setIsUploadingDrive(false);
        setCompletionModalBooking(null);
        setCompletionPhotoBase64('');
        setCompletionPhotoName('');
      };

      // Export CSV
      const handleExportCSV = () => {
        const headers = ['預約單號', '申請時間', '申請人', '電話', '行政區', '詳細地址', '預約日期', '品項明細', '狀態'];
        const rows = bookings.map((b) => [
          b.id,
          b.createdAt,
          b.applicantName,
          b.phone,
          b.district,
          `"${b.address}"`,
          b.preferredDate,
          `"${b.items.map((i) => `${i.name}x${i.quantity}`).join(';')}"`,
          b.status
        ]);
        const csvStr = '\uFEFF' + [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
        const blob = new Blob([csvStr], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `大型廢棄傢俱預約清運資料_${getMinguoCompactStr()}.csv`;
        a.click();
      };

      const pendingCount = bookings.filter((b) => b.status === '已收件' || b.status === '待審核').length;

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* Header */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-emerald-500/20 text-slate-100 shadow-xl no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
              
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('booking')}>
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20 text-slate-950 font-black text-2xl">
                  🚚
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="text-xl sm:text-2xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-emerald-300 via-teal-200 to-emerald-100">
                      大型廢棄傢俱預約清運系統
                    </h1>

            )}

            {/* TAB 3: Sanitation Admin Dashboard */}
            {activeTab === 'admin' && (
              <div className="max-w-7xl mx-auto space-y-6">
                {!isAdminAuth ? (
                  <div className="glass-card max-w-md mx-auto mt-20 p-8 rounded-3xl border border-slate-700 shadow-2xl text-center space-y-6">
                    <div className="text-4xl">🔒</div>
                    <h2 className="text-xl font-bold text-white">請輸入後台管理密碼</h2>
                    <form onSubmit={handleAdminLogin} className="space-y-4">
                      <input 
                        type="password" 
                        value={adminPasswordInput}
                        onChange={(e) => setAdminPasswordInput(e.target.value)}
                        placeholder="請輸入密碼..." 
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 text-center focus:outline-none focus:border-emerald-500"
                        autoFocus
                      />
                      {loginError && <p className="text-rose-400 text-xs">{loginError}</p>}
                      <button type="submit" disabled={isCheckingPassword} className="w-full py-3 rounded-xl bg-emerald-500 text-slate-950 font-black text-sm hover:bg-emerald-400 transition-all">
                        {isCheckingPassword ? '驗證中...' : '登入後台'}
                      </button>
                    </form>
                  </div>
                ) : (
                  <>
                    <div className="flex justify-between items-center">
                      <div>
                        <h2 className="text-2xl font-black text-white">🚚 清潔隊廢棄傢俱車輛調度後台</h2>
                        <p className="text-xs text-slate-400">支援核可排班與現場拍照結案，照片自動上傳至 Google Drive 備查</p>
                      </div>
                      <div className="flex items-center space-x-3">
                        <button onClick={() => setIsAdminAuth(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700 hover:text-white">
                          登出
                        </button>
                        <button onClick={handleExportCSV} className="px-4 py-2 rounded-xl bg-slate-800 text-emerald-400 text-xs font-bold border border-slate-700">
                          📊 匯出 Excel / CSV
                        </button>
                      </div>
                    </div>

                    {/* Metric Summary */}
                    <div className="grid grid-cols-4 gap-4 text-center">
                      <div className="glass-card p-4 rounded-xl border border-slate-700">
                        <span className="text-xs text-slate-400 block">總預約案件</span>
                        <strong className="text-2xl text-slate-100">{bookings.length}</strong>
                      </div>
                      <div className="glass-card p-4 rounded-xl border border-slate-700">
                        <span className="text-xs text-slate-400 block">待審核未排班</span>
                        <strong className="text-2xl text-amber-400">{pendingCount}</strong>
                      </div>
                      <div className="glass-card p-4 rounded-xl border border-slate-700">
                        <span className="text-xs text-slate-400 block">已排班調度</span>
                        <strong className="text-2xl text-emerald-400">{bookings.filter(b=>b.status==='已排班').length}</strong>
                      </div>
                      <div className="glass-card p-4 rounded-xl border border-slate-700">
                        <span className="text-xs text-slate-400 block">已完成清運</span>
                        <strong className="text-2xl text-slate-300">{bookings.filter(b=>b.status==='清運完成').length}</strong>
                      </div>
                    </div>

                    {/* Table */}
                    <div className="glass-card rounded-2xl overflow-hidden border border-slate-700">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-800 text-slate-300 border-b border-slate-700 font-bold">
                          <tr>
                            <th className="p-3">單號/時間</th>
                            <th className="p-3">申請人</th>
                            <th className="p-3">行政區與一樓清運地址</th>
                            <th className="p-3">預約日期</th>
                            <th className="p-3">品項</th>
                            <th className="p-3">狀態</th>
                            <th className="p-3 text-right">審核與拍照結案</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {bookings.map((b) => (
                            <tr key={b.id} className="hover:bg-slate-800/50">
                              <td className="p-3 font-mono font-bold text-emerald-400">{b.id}</td>
                              <td className="p-3 font-bold">{b.applicantName}<br/><span className="text-[10px] font-normal text-slate-400">{b.phone}</span></td>
                              <td className="p-3">
                                {b.mapLink ? (
                                  <a href={b.mapLink} target="_blank" rel="noopener noreferrer" className="hover:text-emerald-400 hover:underline transition-all block" title="點擊開啟 Google Maps">
                                    <strong>[{b.district}]</strong> {b.address}
                                  </a>
                                ) : (
                                  <>
                                    <strong>[{b.district}]</strong> {b.address}
                                  </>
                                )}
                              </td>
                              <td className="p-3 font-semibold">{b.preferredDate}</td>
                              <td className="p-3 text-emerald-300">{b.itemsChinese || b.items?.map(i => `${i.name}x${i.quantity}`).join('; ')}</td>
                              <td className="p-3 font-bold">
                                <span className={`px-2 py-0.5 rounded text-[11px] ${
                                  b.status === '已排班' ? 'bg-emerald-500/20 text-emerald-400' : 
                                  b.status === '清運完成' ? 'bg-slate-700 text-slate-300' : 
                                  'bg-amber-500/20 text-amber-400'
                                }`}>
                                  {b.status}
                                </span>
                              </td>
                              <td className="p-3 text-right space-x-1">
                                <button onClick={() => setPrintableBooking(b)} className="px-2 py-1 bg-slate-800 rounded text-slate-300" title="預覽標籤">標籤</button>
                                
                                {b.status === '已收件' && (
                                  <button onClick={() => handleAdminUpdateStatus(b.id, '已排班', '核可排班')} className="px-2 py-1 bg-emerald-500/20 text-emerald-300 font-bold rounded hover:bg-emerald-500 hover:text-slate-950">
                                    核可排班
                                  </button>
                                )}

                                {b.status !== '清運完成' && b.status !== '已取消' && (
                                  <button
                                    onClick={() => setCompletionModalBooking(b)}
                                    className="px-3 py-1.5 bg-gradient-to-r from-teal-500 via-emerald-500 to-teal-400 text-slate-950 font-black rounded-lg shadow-md hover:from-teal-400 hover:to-emerald-300 transition-all inline-flex items-center space-x-1"
                                  >
                                    <span>📸 拍照上傳結案</span>
                                  </button>
                                )}

                                {b.status === '清運完成' && (
                                  <div className="flex items-center justify-end space-x-1.5">
                                    <span className="text-[11px] text-slate-400 font-bold">已結案</span>
                                    {(() => {
                                      const completedItem = b.statusTimeline?.slice().reverse().find(t => t.status === '清運完成' && t.drivePhotoUrl);
                                      const photoUrl = completedItem ? completedItem.drivePhotoUrl : null;
                                      if (!photoUrl) return null;
                                      return (
                                        <a
                                          href={photoUrl}
                                          target="_blank"
                                          rel="noopener noreferrer"
                                          className="px-2.5 py-1 rounded-lg bg-teal-500/20 text-teal-300 hover:bg-teal-500 hover:text-slate-950 font-bold text-[11px] border border-teal-500/40 inline-flex items-center space-x-1 shadow transition-all"
                                          title="點擊開啟 Google Drive 現場清運完畢照片"
                                        >
                                          <span>📷 檢視結案照片</span>
                                        </a>
                                      );
                                    })()}
                                  </div>
                                )}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </>
                )}
              </div>
            )}

          </main>

          {/* Modal: Sanitation Worker Completion Photo Upload Modal */}
          {completionModalBooking && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="w-full max-w-lg bg-slate-900 rounded-3xl border border-teal-500/40 p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-black text-white flex items-center">
                    <span className="mr-2">📸</span> 清潔隊現場清運完畢拍照上傳結案
                  </h3>
                  <button onClick={() => setCompletionModalBooking(null)} className="text-slate-400 font-bold">✕</button>
                </div>

                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                  <p><strong>單號：</strong><span className="text-emerald-400 font-mono font-bold">{completionModalBooking.id}</span></p>
                  <p><strong>申請人：</strong>{completionModalBooking.applicantName} ({completionModalBooking.phone})</p>
                  <p><strong>一樓放置地點：</strong>{completionModalBooking.address}</p>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-200 mb-1">
                      上傳現場清運完畢照 (上傳至 Google Drive: <code>1TYi7otNJXyEuCdZqx6cqJwNnlZXqH7dV</code>) <span className="text-rose-400">*</span>
                    </label>
                    
                    <div className="border-2 border-dashed border-slate-700 rounded-xl p-4 text-center bg-slate-950 cursor-pointer hover:border-teal-500">
                      <input type="file" accept="image/*" capture="environment" onChange={handleCompletionPhotoFileChange} className="hidden" id="completion-photo-file" />
                      <label htmlFor="completion-photo-file" className="cursor-pointer block space-y-1">
                        <div className="text-2xl">📷</div>
                        <p className="font-bold text-slate-200">拍照或選擇照片檔案</p>
                        <p className="text-[11px] text-slate-400">支援相機拍照或選擇手機/電腦檔案</p>
                      </label>
                    </div>
                  </div>



                  {completionPhotoBase64 && (
                    <div className="relative rounded-xl overflow-hidden bg-slate-950 border border-slate-700 p-2">
                      <img src={completionPhotoBase64} className="w-full h-36 object-cover rounded-lg" />
                      <span className="block text-[11px] text-slate-300 mt-1 truncate">{completionPhotoName || '現場拍照.jpg'}</span>
                    </div>
                  )}

                  <div>
                    <label className="block font-bold text-slate-200 mb-1">結案備註說明</label>
                    <textarea
                      rows={2}
                      value={completionNote}
                      onChange={(e) => setCompletionNote(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                </div>

                <div className="flex justify-end space-x-3 pt-2">
                  <button
                    onClick={() => setCompletionModalBooking(null)}
                    className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs"
                  >
                    取消
                  </button>
                  <button
                    onClick={handleSubmitCompletionModal}
                    disabled={isUploadingDrive || !completionPhotoBase64}
                    className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-teal-500 to-emerald-500 text-slate-950 font-black text-xs shadow-lg disabled:opacity-40"
                  >
                    {isUploadingDrive ? '☁️ 上傳 Google Drive 中...' : '✅ 上傳至 Google Drive 並完成結案'}
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Modal: GAS Web App Config */}
          {showGasModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="w-full max-w-lg bg-slate-900 rounded-3xl border border-emerald-500/40 p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-bold text-white flex items-center">
                    <span className="mr-2">📊</span> 設定 Google Sheet / GAS 雲端資料庫
                  </h3>
                  <button onClick={() => setShowGasModal(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                
                <div className="text-xs space-y-2 text-slate-300">
                  <p>請貼上您的 Google Apps Script 部署後獲得的 **「網頁應用程式 URL」**。設定後本系統將直接寫入試算表，並自動上傳現場結案照至 Google Drive <code>1TYi7otNJXyEuCdZqx6cqJwNnlZXqH7dV</code>！</p>
                  <input
                    type="url"
                    placeholder="https://script.google.com/macros/s/.../exec"
                    defaultValue={gasUrl}
                    id="gas-url-input"
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:border-emerald-500 focus:outline-none"
                  />
                  <p className="text-[11px] text-amber-400">💡 提示：請確認在 GAS 部署設定中「誰有存取權」設為「所有人 (Anyone)」。</p>
                </div>

                <div className="flex justify-end space-x-3 pt-2">
                  {gasUrl && (
                    <button
                      onClick={() => handleSaveGasUrl('')}
                      className="px-4 py-2 rounded-xl bg-rose-500/10 text-rose-300 border border-rose-500/30 text-xs"
                    >
                      清除並改用 LocalStorage
                    </button>
                  )}
                  <button
                    onClick={() => handleSaveGasUrl(document.getElementById('gas-url-input').value)}
                    className="px-6 py-2 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs"
                  >
                    儲存連線設定
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 1: Booking Success */}
          {successBooking && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="w-full max-w-lg bg-slate-900 rounded-3xl border border-emerald-500/40 p-6 space-y-4 text-center">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 text-3xl flex items-center justify-center mx-auto">
                  ✅
                </div>
                <h3 className="text-2xl font-black text-white">大型廢棄傢俱預約成功！</h3>
                <p className="text-xs text-slate-300">預約單號：<strong className="text-emerald-400 font-mono text-lg">{successBooking.id}</strong></p>
                
                {gasUrl && <p className="text-[11px] text-emerald-300">雲端同步狀態：已自動同步寫入至您的 Google 試算表！</p>}

                <div className="bg-slate-950 p-4 rounded-xl text-left text-xs space-y-1 text-slate-300 border border-slate-800">
                  <p><strong>約定清運日期：</strong>{successBooking.preferredDate} ({successBooking.preferredTimeSlot.split(' ')[0]})</p>
                  <p><strong>一樓放置地點：</strong>{successBooking.address}</p>
                  <p><strong>清運品項：</strong>{successBooking.items?.map(i=>`${i.name}x${i.quantity}`).join('、')}</p>
                </div>
                <button
                  onClick={() => { setPrintableBooking(successBooking); setSuccessBooking(null); }}
                  className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black text-sm"
                >
                  🖨️ 立即列印「已預約清運標籤」與 QR Code
                </button>
                <button onClick={() => setSuccessBooking(null)} className="text-xs text-slate-400">關閉</button>
              </div>
            </div>
          )}

          {/* Modal 2: Printable Identification Tag */}
          {printableBooking && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="w-full max-w-2xl bg-slate-900 rounded-3xl border border-slate-700 p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-bold">🖨️ 預約清運標籤列印預覽</h3>
                  <button onClick={() => setPrintableBooking(null)} className="text-slate-400 text-lg font-bold">✕</button>
                </div>

                {/* Printable Area */}
                <div id="printable-tag" className="bg-white text-slate-900 rounded-xl p-6 border-4 border-dashed border-slate-900 space-y-4">
                  <div className="flex justify-between items-start border-b-2 border-slate-900 pb-3">
                    <div>
                      <span className="bg-slate-900 text-white text-[10px] font-bold px-2 py-0.5 rounded">家戶免費清運專案</span>
                      <h2 className="text-xl font-black mt-1">大型廢棄傢俱已預約清運標籤</h2>
                      <p className="text-xs text-slate-600 font-bold">請貼於搬出傢俱外觀明顯處 ‧ 清潔隊現場掃碼核對</p>
                    </div>
                    <QRCodeBox value={`https://clean-city.gov.tw/booking/${printableBooking.id}`} size={80} />
                  </div>

                  <div className="grid grid-cols-2 gap-3 bg-slate-100 p-3 rounded-lg border border-slate-300 text-xs">
                    <div><span className="text-slate-500 block">預約單號</span><strong className="text-emerald-800 text-base font-mono">{printableBooking.id}</strong></div>
                    <div><span className="text-slate-500 block">約定清運日期</span><strong className="text-slate-900 text-sm">{printableBooking.preferredDate}</strong></div>
                    <div><span className="text-slate-500 block">申請人姓名</span><strong className="text-slate-900">{printableBooking.applicantName}</strong></div>
                    <div><span className="text-slate-500 block">聯絡電話</span><strong className="text-slate-900 font-mono">{printableBooking.phone}</strong></div>
                  </div>

                  <div className="text-xs bg-amber-50 p-3 rounded-lg border border-amber-200">
                    <span className="text-slate-500 block font-bold">一樓放置地點</span>
                    <strong className="text-slate-900 text-sm">{printableBooking.address}</strong>
                    {printableBooking.locationNote && <p className="text-slate-600 mt-1">備註: {printableBooking.locationNote}</p>}
                  </div>

                  <div className="text-xs space-y-1">
                    <span className="text-slate-500 font-bold block">待清運品項清單</span>
                    <div className="grid grid-cols-2 gap-2">
                      {printableBooking.items?.map((i, idx) => (
                        <div key={idx} className="bg-slate-100 p-1.5 rounded border border-slate-300 font-bold flex justify-between">
                          <span>{i.name}</span>
                          <span>x {i.quantity}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-300 text-[10px] text-slate-500 flex justify-between">
                    <span>※ 請勿夾雜事業廢棄物或危險物品 ‧ 清潔隊客服: (02) 2720-8889</span>
                    <span>列印日期: {getMinguoTime().split(' ')[0]}</span>
                  </div>
                </div>

                <div className="flex justify-end space-x-3 pt-2">
                  <button onClick={() => setPrintableBooking(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs">關閉</button>
                  <button onClick={() => window.print()} className="px-6 py-2 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs">列印標籤</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-16 bg-slate-900 border-t border-slate-800 text-slate-400 py-8 no-print text-xs text-center space-y-2">
            <p>大型廢棄傢俱預約清運管理系統 ‧ 市民服務專線 1999 ‧ 清潔隊客服 (02) 2720-8889</p>
            <p className="text-slate-500">© 2026 環保局家戶大型廢棄物清運專區. All rights reserved.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
