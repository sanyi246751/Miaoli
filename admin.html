  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function getMinguoTime(d) {
      if (!d) d = new Date();
      if (!(d instanceof Date)) {
        var raw = String(d).trim();
        var parts = raw.match(/\d+/g);
        if (raw.indexOf('民國') === 0 && parts && parts.length >= 3) {
          d = new Date(Number(parts[0]) + 1911, Number(parts[1]) - 1, Number(parts[2]), Number(parts[3] || 0), Number(parts[4] || 0));
        } else {
          d = new Date(raw);
        }
        if (isNaN(d.getTime())) return raw;
      }
      var year = d.getFullYear() - 1911;
      var month = d.getMonth() + 1;
      var day = d.getDate();
      var period = d.getHours() < 12 ? '上午' : '下午';
      var hours = ('0' + (d.getHours() % 12 || 12)).slice(-2);
      var minutes = ('0' + d.getMinutes()).slice(-2);
      return year + '/' + month + '/' + day + period + hours + ':' + minutes;
    }

    function formatMinguoDate(value) {
      if (/^\d{2,3}\/\d{1,2}\/\d{1,2}$/.test(String(value || ''))) return value;
      return getMinguoTime(value).replace(/(上午|下午).*/, '');
    }
    
    function getMinguoCompactStr(d) {
      if (!d) d = new Date();
      var year = d.getFullYear() - 1911;
      var month = d.getMonth() + 1;
      var day = d.getDate();
      return year + month + day;
    }

    // Data Constants
    const CATEGORIES = [
      { id: 'mattress', name: '床墊', icon: '🛏️', desc: '單人床墊、雙人床墊、彈簧床' },
      { id: 'cabinet', name: '櫃子', icon: '🗄️', desc: '衣櫃、鞋櫃、斗櫃、酒櫃、電視櫃' },
      { id: 'table', name: '桌子', icon: '🪑', desc: '餐桌、書桌、茶幾、電腦桌' },
      { id: 'chair', name: '椅子', icon: '🛋️', desc: '單人椅、辦公椅、雙人沙發、三人沙發' },
      { id: 'tv', name: '電視', icon: '📺', desc: '液晶電視、傳統電視（家電類）' },
      { id: 'fridge', name: '冰箱', icon: '🧊', desc: '單門冰箱、雙門/多門冰箱（家電類）' },
      { id: 'other', name: '其他', icon: '📦', desc: '大型收納架、金屬架、彈簧床框等' },
    ];

    const COUNTIES = [
      '基隆市', '台北市', '新北市', '桃園市', '新竹市', '新竹縣', '苗栗縣', 
      '台中市', '彰化縣', '南投縣', '雲林縣', '嘉義市', '嘉義縣', '台南市', 
      '高雄市', '屏東縣', '宜蘭縣', '花蓮縣', '台東縣', '澎湖縣', '金門縣', '連江縣'
    ];

    const CITY_DISTRICTS = [
      '信義區', '大安區', '中山區', '內湖區', '士林區', '北投區', 
      '松山區', '萬華區', '文山區', '南港區', '中正區', '大同區',
      '板橋區', '新莊區', '中和區', '三重區', '新店區', '土城區', '三義鄉', '苑裡鎮', '通霄鎮'
    ];

    const TERMS_LIST = [
      {
        id: 1,
        title: '服務對象限制',
        content: '本免費清運服務僅限一般家戶廢棄大型傢俱，事業單位（公司、工廠、飯店、店家等）或裝修廢棄物恕不受理。'
      },
      {
        id: 2,
        title: '搬運與放置地點規定',
        content: '申請人須於約定清運時間當日（或前一日晚上）將物品自行搬運至一樓約定地點放置，且不得妨礙道路交通安全。'
      },
      {
        id: 3,
        title: '清運單號標示規定',
        content: '請於搬出物品上貼妥「已預約清運單號或聯絡人姓名電話」字樣，以免被視為違規棄置。'
      },
      {
        id: 4,
        title: '嚴禁夾雜危險物品',
        content: '嚴禁夾雜危險物品（如高壓氣瓶、易燃物）、一般生活垃圾或一般事業廢棄物。'
      },
      {
        id: 5,
        title: '個人資料保護聲明',
        content: '本所個人資料蒐集目的僅作為廢棄物清運聯繫與核對使用，依個人資料保護法予以保護。'
      }
    ];

    const INITIAL_BOOKINGS = [];

    // Helper QR Code Component
    function QRCodeBox({ value, size = 96 }) {
      const qrRef = useRef(null);

      useEffect(() => {
        if (qrRef.current) {
          qrRef.current.innerHTML = '';
          if (window.QRCode) {
            new window.QRCode(qrRef.current, {
              text: value,
              width: size,
              height: size,
              colorDark: '#0f172a',
              colorLight: '#ffffff',
              correctLevel: window.QRCode.CorrectLevel.H
            });
          }
        }
      }, [value, size]);

      return <div ref={qrRef} className="inline-block p-1 bg-white rounded border border-slate-300" />;
    }

    // Main App Component
    function App() {
      const [activeTab, setActiveTab] = useState('admin'); // 獨立後台頁面
      
      // GAS Web App URL state pre-configured with user's endpoint
      const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbw2fzd48VzT4IJgeFORnlid9VPOoHggihOBpqTc32ZdfwaAESUZrk_gRiMxnieQsxPq3g/exec';
      const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('gas_web_app_url') || DEFAULT_GAS_URL);
      const [showGasModal, setShowGasModal] = useState(false);
      const [isSyncingGas, setIsSyncingGas] = useState(false);
      const [syncMessage, setSyncMessage] = useState('');

      const [bookings, setBookings] = useState(() => {
        const saved = localStorage.getItem('bulky_furniture_bookings');
        return saved ? JSON.parse(saved) : INITIAL_BOOKINGS;
      });

      // Sync to localStorage as local cache
      useEffect(() => {
        const lightweightBookings = bookings.map((b) => ({ ...b, photos: (b.photos || []).filter((url) => !String(url).startsWith('data:')) }));
        localStorage.setItem('bulky_furniture_bookings', JSON.stringify(lightweightBookings));
      }, [bookings]);

      // Fetch from Google Sheets if GAS URL is configured
      const fetchFromGoogleSheets = async () => {
        if (!gasUrl) return;
        setIsSyncingGas(true);
        try {
          const res = await fetch(gasUrl);
          const json = await res.json();
          if (json.status === 'success' && json.data && Array.isArray(json.data) && json.data.length > 0) {
            setBookings(json.data);
            setSyncMessage(`已成功從 Google 試算表同步 ${json.data.length} 筆資料`);
          }
        } catch (e) {
          console.error('GAS Fetch Error:', e);
        } finally {
          setIsSyncingGas(false);
        }
      };

      useEffect(() => {
        let intervalId;
        if (gasUrl) {
          fetchFromGoogleSheets();
          // 每 60 秒自動從 Google Sheets 拉取最新資料 (Auto Pull)
          intervalId = setInterval(() => {
            fetchFromGoogleSheets();
          }, 60000);
        }
        return () => {
          if (intervalId) clearInterval(intervalId);
        };
      }, [gasUrl]);

      const handleSaveGasUrl = (url) => {
        const trimmed = url.trim();
        setGasUrl(trimmed);
        localStorage.setItem('gas_web_app_url', trimmed);
        setShowGasModal(false);
        if (trimmed) {
          fetchFromGoogleSheets();
        }
      };

      // Modal States
      const [successBooking, setSuccessBooking] = useState(null);
      const [printableBooking, setPrintableBooking] = useState(null);
      const [completionModalBooking, setCompletionModalBooking] = useState(null); // Sanitation Photo Completion Modal

      // Admin Auth State
      const ADMIN_SESSION_MS = 30 * 60 * 1000;
      const [isAdminAuth, setIsAdminAuth] = useState(() => Number(localStorage.getItem('admin_auth_until') || 0) > Date.now());
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [isCheckingPassword, setIsCheckingPassword] = useState(false);
      const [loginError, setLoginError] = useState('');

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        if (!gasUrl) {
          if (adminPasswordInput === 'admin') {
            setIsAdminAuth(true);
            localStorage.setItem('admin_auth_until', String(Date.now() + ADMIN_SESSION_MS));
            setAdminPasswordInput('');
          } else {
            setLoginError('密碼錯誤 (Local Mode: 預設為 admin)');
          }
          return;
        }

        setIsCheckingPassword(true);
        try {
          const checkUrl = gasUrl + '?action=verifyPassword&password=' + encodeURIComponent(adminPasswordInput);
          const res = await fetch(checkUrl);
          const json = await res.json();
          if (json.status === 'success' && json.valid) {
            setIsAdminAuth(true);
            localStorage.setItem('admin_auth_until', String(Date.now() + ADMIN_SESSION_MS));
            setAdminPasswordInput('');
          } else {
            setLoginError('密碼錯誤，請重新輸入。');
          }
        } catch (e) {
          console.error('Login Error:', e);
          setLoginError('連線驗證失敗，請檢查網路或 GAS 設定。');
        } finally {
          setIsCheckingPassword(false);
        }
      };

      // 後台登入狀態保留 30 分鐘，逾時才自動登出。
      useEffect(() => {
        const checkAdminSession = () => {
          if (Number(localStorage.getItem('admin_auth_until') || 0) <= Date.now()) {
            setIsAdminAuth(false);
            localStorage.removeItem('admin_auth_until');
          }
        };
        checkAdminSession();
        const timer = setInterval(checkAdminSession, 30000);
        return () => clearInterval(timer);
      }, []);

      // Form State
      const [applicantName, setApplicantName] = useState('');
      const [phone, setPhone] = useState('');
      const [email, setEmail] = useState('');
      const [county, setCounty] = useState('苗栗縣');
      const [district, setDistrict] = useState('三義鄉');
      const [detailAddress, setDetailAddress] = useState('');
      const [selectedItems, setSelectedItems] = useState([]);
      const [photos, setPhotos] = useState([]);
      const defaultDate = new Date(Date.now() + 3 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      const [preferredDate, setPreferredDate] = useState(defaultDate);
      const [preferredTimeSlot, setPreferredTimeSlot] = useState('上午8點至12點');
      const [locationNote, setLocationNote] = useState('');
      const [agreedTerms, setAgreedTerms] = useState([]);
      const [errors, setErrors] = useState({});
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitSecondsLeft, setSubmitSecondsLeft] = useState(0);

      // Completion Photo Upload State for Sanitation Worker
      const [completionPhotoBase64, setCompletionPhotoBase64] = useState('');
      const [completionPhotoName, setCompletionPhotoName] = useState('');
      const [completionNote, setCompletionNote] = useState('隊員已現場載運完畢，路面恢復清潔並拍攝照片結案。');
      const [isUploadingDrive, setIsUploadingDrive] = useState(false);

      // Query Search state
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [hasSearched, setHasSearched] = useState(false);



      // Item quantity control
      const handleItemQtyChange = (catId, delta) => {
        setSelectedItems((prev) => {
          const found = prev.find((i) => i.categoryId === catId);
          if (found) {
            const nextQty = found.quantity + delta;
            if (nextQty <= 0) return prev.filter((i) => i.categoryId !== catId);
            return prev.map((i) => (i.categoryId === catId ? { ...i, quantity: nextQty } : i));
          } else if (delta > 0) {
            const catObj = CATEGORIES.find((c) => c.id === catId);
            return [...prev, { categoryId: catId, categoryName: catObj.name, name: catObj.name, quantity: 1, note: '' }];
          }
          return prev;
        });
      };

      const getItemQty = (catId) => {
        const found = selectedItems.find((i) => i.categoryId === catId);
        return found ? found.quantity : 0;
      };
      const getItemNote = (catId) => selectedItems.find((i) => i.categoryId === catId)?.note || '';
      const handleItemNoteChange = (catId, note) => setSelectedItems((prev) => prev.map((i) => i.categoryId === catId ? { ...i, note, name: catId === 'other' ? (note || '其他') : i.name } : i));

      // Photo Drag & Drop
      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        files.forEach((file) => {
          if (!file.type.startsWith('image/')) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            const image = new Image();
            image.onload = () => {
              const scale = Math.min(1, 1600 / Math.max(image.width, image.height));
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(image.width * scale); canvas.height = Math.round(image.height * scale);
              canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
              setPhotos((prev) => [...prev, { id: Date.now() + Math.random(), name: file.name.replace(/\.[^.]+$/, '') + '.jpg', url: canvas.toDataURL('image/jpeg', 0.84) }]);
            };
            image.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      };



      // Terms Agreement Toggle
      const isAllTermsAgreed = TERMS_LIST.every((t) => agreedTerms.includes(t.id));
      const handleToggleTerm = (id) => {
        if (agreedTerms.includes(id)) {
          setAgreedTerms(agreedTerms.filter((i) => i !== id));
        } else {
          setAgreedTerms([...agreedTerms, id]);
        }
      };

      // Form Validation & Submission
      const handleFormSubmit = async (e) => {
        e.preventDefault();
        if (isSubmitting) return;
        const errs = {};
        if (!applicantName.trim()) errs.applicantName = '請輸入申請人姓名';
        if (!phone.trim()) errs.phone = '請輸入聯絡電話';
        else if (!/^09\d{2}-?\d{3}-?\d{3}$/.test(phone.trim()) && !/^\d{8,10}$/.test(phone.trim())) {
          errs.phone = '請輸入正確格式電話 (如: 0912-345-678)';
        }
        if (!detailAddress.trim()) errs.detailAddress = '請填寫詳細清運地址';
        if (selectedItems.length === 0) errs.items = '請至少選擇一項待清運傢俱項目';
        if (agreedTerms.length < TERMS_LIST.length) errs.terms = '需全數同意 5 項申請聲明與規定';

        setErrors(errs);
        if (Object.keys(errs).length > 0) {
          window.scrollTo({ top: 120, behavior: 'smooth' });
          return;
        }

                    <button
                      onClick={() => handleSaveGasUrl('')}
                      className="px-4 py-2 rounded-xl bg-rose-500/10 text-rose-300 border border-rose-500/30 text-xs"
                    >
                      清除並改用 LocalStorage
                    </button>
                  )}
                  <button
                    onClick={() => handleSaveGasUrl(document.getElementById('gas-url-input').value)}
                    className="px-6 py-2 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs"
                  >
                    儲存連線設定
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 1: Booking Success */}
          {successBooking && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="w-full max-w-lg bg-slate-900 rounded-3xl border border-emerald-500/40 p-6 space-y-4 text-center">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 text-3xl flex items-center justify-center mx-auto">
                  ✅
                </div>
                <h3 className="text-2xl font-black text-white">大型廢棄傢俱預約成功！</h3>
                <p className="text-xs text-slate-300">預約單號：<strong className="text-emerald-400 font-mono text-lg">{successBooking.id}</strong></p>
                
                {gasUrl && <p className="text-[11px] text-emerald-300">雲端同步狀態：已自動同步寫入至您的 Google 試算表！</p>}

                <div className="success-summary bg-slate-950 p-4 rounded-xl text-left text-xs space-y-1 text-white border border-slate-800">
                  <p><strong>約定清運日期：</strong>{formatMinguoDate(successBooking.preferredDate)} ({successBooking.preferredTimeSlot.split(' ')[0]})</p>
                  <p><strong>一樓放置地點：</strong>{successBooking.address}</p>
                  <p><strong>清運品項：</strong>{successBooking.items?.map(i=>`${i.name}x${i.quantity}`).join('、')}</p>
                </div>
                <button
                  onClick={() => { setPrintableBooking(successBooking); setSuccessBooking(null); }}
                  className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black text-sm"
                >
                  🖨️ 立即列印「已預約清運標籤」與 QR Code
                </button>
                <button onClick={() => { setSuccessBooking(null); setActiveTab('booking'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="text-xs font-bold text-emerald-300">回到申請頁面</button>
              </div>
            </div>
          )}

          {/* Modal 2: Printable Identification Tag */}
          {printableBooking && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="w-full max-w-2xl bg-slate-900 rounded-3xl border border-slate-700 p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-bold">🖨️ 預約清運標籤列印預覽</h3>
                  <button onClick={() => setPrintableBooking(null)} className="text-slate-400 text-lg font-bold">✕</button>
                </div>

                {/* Printable Area */}
                <div id="printable-tag" className="bg-white text-slate-900 text-center rounded-xl p-6 border-4 border-dashed border-slate-900 space-y-4 mx-auto">
                  <div className="flex flex-col items-center border-b-2 border-slate-900 pb-3 gap-3">
                    <div className="text-center">
                      <span className="bg-slate-900 text-white text-[10px] font-bold px-2 py-0.5 rounded">家戶免費清運專案</span>
                      <h2 className="text-xl font-black mt-1">大型廢棄傢俱已預約清運標籤</h2>
                      <p className="text-xs text-slate-600 font-bold">請貼於搬出傢俱外觀明顯處 ‧ 清潔隊現場掃碼核對</p>
                    </div>
                    <QRCodeBox value={`https://clean-city.gov.tw/booking/${printableBooking.id}`} size={80} />
                  </div>

                  <div className="grid grid-cols-2 gap-3 bg-slate-100 p-3 rounded-lg border border-slate-300 text-xs">
                    <div><span className="text-slate-500 block">預約單號</span><strong className="text-emerald-800 text-base font-mono">{printableBooking.id}</strong></div>
                    <div><span className="text-slate-500 block">約定清運日期</span><strong className="text-slate-900 text-sm">{formatMinguoDate(printableBooking.preferredDate)}</strong></div>
                    <div><span className="text-slate-500 block">申請人姓名</span><strong className="text-slate-900">{printableBooking.applicantName}</strong></div>
                    <div><span className="text-slate-500 block">聯絡電話</span><strong className="text-slate-900 font-mono">{printableBooking.phone}</strong></div>
                  </div>

                  <div className="text-xs bg-amber-50 p-3 rounded-lg border border-amber-200">
                    <span className="text-slate-500 block font-bold">一樓放置地點</span>
                    <strong className="text-slate-900 text-sm">{printableBooking.address}</strong>
                    {printableBooking.locationNote && <p className="text-slate-600 mt-1">備註: {printableBooking.locationNote}</p>}
                  </div>

                  <div className="text-xs space-y-1">
                    <span className="text-slate-500 font-bold block">待清運品項清單</span>
                    <div className="grid grid-cols-2 gap-2">
                      {printableBooking.items?.map((i, idx) => (
                        <div key={idx} className="bg-slate-100 p-1.5 rounded border border-slate-300 font-bold flex justify-between">
                          <span>{i.name}</span>
                          <span>x {i.quantity}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-300 text-[10px] text-slate-500 flex justify-between">
                    <span>※ 請勿夾雜事業廢棄物或危險物品 ‧ 清潔隊客服: (02) 2720-8889</span>
                    <span>列印日期: {formatMinguoDate(new Date())}</span>
                  </div>
                </div>

                <div className="flex justify-end space-x-3 pt-2">
                  <button onClick={() => setPrintableBooking(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs">關閉</button>
                  <button onClick={() => window.print()} className="px-6 py-2 rounded-xl bg-emerald-500 text-slate-950 font-black text-xs">列印標籤</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-16 bg-emerald-950 border-t border-emerald-900 text-emerald-100/70 py-9 no-print text-xs text-center space-y-2">
            <p>大型廢棄傢俱預約清運管理系統 ‧ 市民服務專線 1999 ‧ 清潔隊客服 (02) 2720-8889</p>
            <p className="text-slate-500">© 2026 環保局家戶大型廢棄物清運專區. All rights reserved.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
